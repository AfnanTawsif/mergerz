[build-system]
requires = [
    "setuptools>=77",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "mergerz"
version = "5.0.8"
description = "Mergerz is a powerful PDF utility."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Afnan Tawsif", email = "fatemajannat0049@gmail.com" },
]
license = "LicenseRef-Proprietary"
license-files = ["LICENSE.txt"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]
dependencies = [
    "Pillow",
    "PyMuPDF",
    "natsort",
    "pikepdf",
    "PySide6",
    "python-iso639",
]

[project.gui-scripts]
mergerz = "mergerz.module:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["mergerz*"]

[tool.setuptools.package-data]
mergerz = [
    "icons/*.svg",
    "fonts/*.ttf",
]
